<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Transpo Pro - Tanger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
*{font-family:'Tajawal',sans-serif}
.glass{backdrop-filter:blur(16px);background:rgba(255,255,255,0.85)}
.map-dot{width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 3px rgba(0,0,0,0.2)}
.anim-pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.trip-green{border-left:5px solid #10b981}
.trip-orange{border-left:5px solid #f59e0b}
.trip-red{border-left:5px solid #ef4444}
.trip-blue{border-left:5px solid #3b82f6}
</style>

<body class="bg-[#f6f7fb] text-zinc-900 overflow-hidden">
<!-- LANG SCREEN -->
<div id="screen-lang" class="fixed inset-0 z-[100] bg-gradient-to-br from-zinc-900 to-black text-white flex flex-col p-6">
  <div class="flex-1 flex flex-col justify-center">
    <h1 class="text-4xl font-black mb-2">Transpo<span class="text-yellow-400">PRO</span></h1>
    <p class="text-zinc-400 mb-8">نقل مدرسي + حافلات + نقل عمال - طنجة</p>
    <h2 class="text-xl font-bold mb-4">اختر لغتك / Choisissez</h2>
    <div class="grid grid-cols-1 gap-3">
      <button onclick="setLang('ar')" class="bg-white text-black p-4 rounded-2xl flex justify-between items-center font-bold"><span>🇲🇦 العربية - دارجة</span><i class="fa fa-check"></i></button>
      <button onclick="setLang('fr')" class="bg-zinc-800 p-4 rounded-2xl flex justify-between items-center"><span>🇫🇷 Français</span><i class="fa fa-chevron-left"></i></button>
      <button onclick="setLang('en')" class="bg-zinc-800 p-4 rounded-2xl flex justify-between items-center"><span>🇬🇧 English</span><i class="fa fa-chevron-left"></i></button>
      <button onclick="setLang('es')" class="bg-zinc-800 p-4 rounded-2xl flex justify-between items-center"><span>🇪🇸 Español</span><i class="fa fa-chevron-left"></i></button>
      <button onclick="setLang('ber')" class="bg-zinc-800 p-4 rounded-2xl flex justify-between items-center"><span>ⵣ ⵜⴰⵎⴰⵣⵉⵖⵜ</span><i class="fa fa-chevron-left"></i></button>
    </div>
  </div>
  <p class="text-center text-zinc-500 text-xs">15 يوم مجانا - بدون التزام</p>
</div>

<!-- LOGIN CODE -->
<div id="screen-login" class="fixed inset-0 z-[90] bg-white hidden flex-col p-6">
  <div class="mt-10">
    <h2 class="text-3xl font-black">دخل كود الدخول</h2>
    <p class="text-zinc-500 mt-2">أي كود يخدم دابا - 15 يوم فابور</p>
    <input id="accessCode" class="mt-8 w-full p-5 rounded-2xl border-2 border-zinc-200 text-center text-2xl font-black tracking-[0.3em]" placeholder="•••• ••" maxlength="8">
    <div class="mt-4 grid grid-cols-2 gap-3 text-xs">
      <div class="bg-green-50 p-3 rounded-xl border border-green-200"><b>TRIAL-15</b> مجاني</div>
      <div class="bg-zinc-50 p-3 rounded-xl"><b>DEMO-2026</b> للتجريب</div>
    </div>
    <button onclick="checkCode()" class="mt-6 w-full bg-black text-white p-5 rounded-2xl font-black text-lg">دخول <i class="fa fa-arrow-left mr-2"></i></button>
    <div class="mt-6 bg-yellow-50 p-4 rounded-2xl text-sm">💡 <b>حتى بلا إنترنت:</b> دير *6 و غادي توصلك SMS بالموقع</div>
  </div>
</div>

<!-- SUBSCRIPTION -->
