<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق العرس - Wedding App</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma}
  body{background:linear-gradient(135deg,#fff0f5,#ffe4e1);min-height:100vh}
  #languageScreen{position:fixed;inset:0;background:linear-gradient(135deg,#ff9a9e,#fecfef);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}
  .lang-card{background:white;padding:20px 30px;border-radius:20px;margin:10px;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.1);transition:.3s;border:3px solid transparent;text-align:center}
  .lang-card:hover,.lang-card.active{border-color:#ff4081;transform:scale(1.05)}
  .lang-card span{font-size:40px}
  .btn{background:#ff4081;color:white;border:none;padding:15px 50px;border-radius:30px;font-size:18px;cursor:pointer;margin-top:30px;box-shadow:0 5px 15px rgba(255,64,129,.4)}
  #appScreen{display:none;padding:20px}
  .header{background:white;padding:20px;border-radius:20px;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,.05);margin-bottom:20px}
  .upload-box{border:3px dashed #ff4081;border-radius:20px;padding:40px;text-align:center;background:white;cursor:pointer}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;margin-top:20px}
  .gallery img{width:100%;border-radius:15px;box-shadow:0 5px 10px rgba(0,0,0,.1)}
</style>
</head>
<body>

<!-- 1 - واجهة اللغة فقط - كتبان أول مرة -->
<div id="languageScreen">
  <h1 style="color:white;font-size:50px;margin-bottom:10px">💖</h1>
  <h2 style="color:white;margin-bottom:30px">اختر لغتك / Choisissez / Choose Language</h2>
  <div style="display:flex;flex-wrap:wrap;justify-content:center">
    <div class="lang-card active" data-lang="ar" onclick="selectLang('ar')"><span>🇲🇦</span><br><b>العربية</b></div>
    <div class="lang-card" data-lang="fr" onclick="selectLang('fr')"><span>🇫🇷</span><br><b>Français</b></div>
    <div class="lang-card" data-lang="en" onclick="selectLang('en')"><span>🇬🇧</span><br><b>English</b></div>
  </div>
  <button class="btn" onclick="enterApp()">دخول - Entrer - Enter</button>
</div>

<!-- 2 - باقي التطبيق -->
<div id="appScreen">
  <div class="header">
    <h1 id="appTitle">تطبيق العرس 👰🤵</h1>
    <p id="appSub">ارفع صورة أو فيديو باش نصاوبو ليك صورة عرس</p>
  </div>

  <div class="upload-box" onclick="document.getElementById('fileInput').click()">
    <p style="font-size:40px">📸</p>
    <p id="uploadText">اضغط لرفع صورة العرسان</p>
    <input type="file" id="fileInput" hidden accept="image/*,video/*" onchange="handleFile(this)">
  </div>

  <div style="margin-top:20px;display:flex;gap:10px">
    <button class="btn" style="flex:1" onclick="createWedding('moroccan')" id="btnMoroccan">عرس مغربي</button>
    <button class="btn" style="flex:1;background:#6c63ff" onclick="createWedding('white')" id="btnWhite">عرس عصري</button>
  </div>

  <div class="gallery" id="gallery"></div>
</div>

<script>
let currentLang = localStorage.getItem('wedding_lang') || 'ar';
let firstTime = localStorage.getItem('wedding_first') === null;

const translations = {
  ar: {title:"تطبيق العرس 👰🤵", sub:"ارفع صورة أو فيديو باش نصاوبو ليك صورة عرس", upload:"اضغط لرفع صورة العرسان", moroccan:"عرس مغربي", white:"عرس عصري"},
  fr: {title:"App Mariage 👰🤵", sub:"Téléchargez photo/vidéo pour créer photo mariage", upload:"Cliquez pour télécharger", moroccan:"Mariage Marocain", white:"Mariage Moderne"},
  en: {title:"Wedding App 👰🤵", sub:"Upload photo/video to create wedding photo", upload:"Click to upload couple photo", moroccan:"Moroccan Wedding", white:"Modern Wedding"}
};

// إذا ماشي أول مرة، دوز نيشان للتطبيق
if(!firstTime){
  document.getElementById('languageScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  applyLang(currentLang);
}

function selectLang(lang){
  currentLang = lang;
  document.querySelectorAll('.lang-card').forEach(c=>c.classList.remove('active'));
  document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
}

function enterApp(){
  localStorage.setItem('wedding_lang', currentLang);
  localStorage.setItem('wedding_first', 'done');
  document.getElementById('languageScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  applyLang(currentLang);
}

function applyLang(lang){
  const t = translations[lang];
  document.getElementById('appTitle').innerText = t.title;
  document.getElementById('appSub').innerText = t.sub;
  document.getElementById('uploadText').innerText = t.upload;
  document.getElementById('btnMoroccan').innerText = t.moroccan;
  document.getElementById('btnWhite').innerText = t.white;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
}

function handleFile(input){
  const file = input.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = `<div style="background:white;padding:10px;border-radius:15px"><p>تم الرفع ✅</p><img src="${url}" style="width:100%;border-radius:10px;margin-top:10px"></div>`;
}

function createWedding(type){
  alert(currentLang==='ar'? `غادي نصاوب ليك صورة ${type==='moroccan'?'عرس مغربي':'عرس عصري'} زوينة!` : `Creating ${type} wedding photo...`);
  // هنا تزيد كود الـ AI ديالك
}
</script>
</body>
</html>
